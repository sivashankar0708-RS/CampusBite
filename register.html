<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration – CampusBite</title>
  <meta name="description" content="Register your college student ID to start pre-ordering meals." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Sticky Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🍽️</div>
        <span>Campus<span class="accent">Bite</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/menu.html" class="nav-link">Menu</a></li>
        <li><a href="/orders.html" class="nav-link">My Orders</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-secondary btn-sm">Already Registered? Login</a>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top: 40px; padding-bottom: 60px;">
    <div style="max-width: 580px; margin: 0 auto; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-light); padding: 36px 32px; box-shadow: var(--shadow-md);">
      
      <div style="text-align: center; margin-bottom: 26px;">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 6px;">Create Student Account</h1>
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          Register with your college roll number for instant tray pre-orders.
        </p>
      </div>

      <form id="registerForm">
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="regName">Full Name *</label>
            <input type="text" id="regName" name="name" class="form-control" placeholder="Aarav Sharma" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="regStudentId">Student ID / Roll No *</label>
            <input type="text" id="regStudentId" name="studentId" class="form-control" placeholder="BCA2024018" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">College Email *</label>
          <input type="email" id="regEmail" name="email" class="form-control" placeholder="student@college.edu" required />
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="regDept">Department *</label>
            <input type="text" id="regDept" name="department" class="form-control" placeholder="e.g. BCA / Computer Applications" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="regYear">Academic Year *</label>
            <select id="regYear" name="year" class="form-control" required>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year" selected>2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPhone">Mobile Number (10 Digits) *</label>
          <input type="tel" id="regPhone" name="phone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required />
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="regPassword">Password *</label>
            <input type="password" id="regPassword" name="password" class="form-control" placeholder="Minimum 4 characters" minlength="4" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
            <input type="password" id="regConfirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat password" required />
          </div>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Create Account & Order Food →
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="/login.html" style="color: var(--primary-orange); font-weight: 700;">Login Here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 CampusBite – College Canteen Pre-Order System</div>
        <div><a href="/login.html">Login Page</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
